name: Mağaza keşfi (geçici)
on:
  push:
    branches: ['claude/**']
    paths: ['scraper/kesif.mjs', '.github/workflows/kesif.yml']
jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scraper/kesif.mjs
      - if: always()
        run: for f in kesif/*.txt; do echo "===== $f"; cat "$f"; done
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: kesif, path: kesif/ }
