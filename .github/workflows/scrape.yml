name: Fiyatları güncelle

# Kendi veri toplama motorumuz (scraper/). Ücretli servis kullanmaz; depo herkese açık olduğu için GitHub Actions ücretsizdir.
# Saatte bir uyanır, sitedeki plana bakar: yalnızca zamanı gelen (panelde seçilen sıklık) ya da panelden
# "Şimdi çalıştır" denen mağazalar taranır. Zamanı gelen yoksa iş ~20 saniyede biter.

on:
  schedule:
    - cron: '17 * * * *'   # saatte bir (asıl sıklık mağaza başına panelden ayarlanır, varsayılan 6 saat)
  workflow_dispatch:
    inputs:
      magaza:
        description: 'Yalnızca bu mağaza (boş = zamanı gelenler)'
        required: false
      hepsi:
        description: 'Zamanı gelmemiş mağazaları da tara (1 = evet)'
        required: false
        default: '0'
      yeni_limit:
        description: 'Mağaza başına yeni ürün sayfası sınırı'
        required: false
        default: '400'
      kuru:
        description: 'Deneme: siteye gönderme (1 = evet)'
        required: false
        default: '0'
      ornek:
        description: 'Denemede mağaza başına en fazla kaç sayfa (0 = sınırsız)'
        required: false
        default: '0'

concurrency: { group: fiyat, cancel-in-progress: false }

# Siteye giriş şifresiz: GitHub her çalıştırmaya imzalı kısa ömürlü bir kimlik belirteci verir (OIDC),
# site yalnızca bu deponun bu iş akışından gelen belirteci kabul eder (src/oidc.js). ADMIN_PASSWORD gizli anahtarı gerekmez.
permissions:
  contents: read
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      MAGAZA: ${{ inputs.magaza }}
      HEPSI: ${{ inputs.hepsi }}
      YENI_LIMIT: ${{ inputs.yeni_limit }}
      KURU: ${{ inputs.kuru }}
      ORNEK: ${{ inputs.ornek }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Ayarları kontrol et
        run: |
          if [ "$KURU" != "1" ] && [ -z "$SITE_URL" ]; then
            echo "::error::Depo ayarlarında SITE_URL değişkeni gerekli. README'deki kurulum adımlarına bakın."
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - name: Zamanı gelen mağazalar
        id: plan
        run: node scraper/plan.mjs
      - name: Site haritası önbelleği
        if: steps.plan.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/scraper
          key: sitemap-${{ github.run_id }}
          restore-keys: sitemap-
      - name: Playwright (yalnızca JavaScript ile yüklenen mağaza varsa)
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.render == 'true'
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.65.0
          npx playwright install --with-deps --only-shell chromium
      - name: Mağazaları tara (yeni ürünler + fiyatlar)
        if: steps.plan.outputs.run == 'true'
        # Node bellek sınırı: Actions makinesini zorlamasın
        run: node --max-old-space-size=1024 scraper/katalog.mjs
      - name: Elle eklenen bağlantıların fiyatlarını çek
        if: inputs.kuru != '1' && steps.plan.outputs.manual == 'true'
        run: node scraper/scrape.mjs
