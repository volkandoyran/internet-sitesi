name: Fiyatları güncelle

on:
  schedule:
    - cron: '0 5 * * *'   # her gün 08:00 (Türkiye saati)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fiyatları çek
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.pages.dev', vars.PROJECT_NAME || 'ucfiyat') }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node scraper/scrape.mjs
