name: Gündem kısa videoları

# Gündem sitesindeki en çok konuşulan uygun haberden 9:16 kısa video üretir ve bağlı platformlarda
# (YouTube Shorts, Instagram Reels) onay beklemeden paylaşır. Tamamen ücretsiz: Piper ses + FFmpeg.
# Kurulum: gundem-sitesi/video/README.md

on:
  schedule:
    - cron: '20 5,9,13,17 * * *'   # günde 4 kez (Türkiye saatiyle 08:20, 12:20, 16:20, 20:20)
  workflow_dispatch:
    inputs:
      kuru:
        description: 'Deneme: siteye bağlanma, örnek haberle yalnızca video üret (1 = evet)'
        required: false
        default: '0'
  pull_request:
    paths: ['gundem-sitesi/video/**', '.github/workflows/gundem-video.yml']

concurrency: { group: gundem-video, cancel-in-progress: false }

# Siteye kimliğini GitHub'ın imzalı jetonuyla (OIDC) kanıtlar; gizli anahtar girmek gerekmez.
permissions:
  contents: read
  id-token: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KURU: ${{ github.event_name == 'pull_request' && '1' || inputs.kuru || '0' }}
      GUNDEM_URL: ${{ vars.GUNDEM_URL || 'https://gundem-sitesi.vitrin-web.workers.dev' }}
      VIDEO_ANAHTAR: ${{ secrets.VIDEO_ANAHTAR }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_GRAPH: ${{ vars.IG_GRAPH }}
      PIPER_SES: ${{ vars.PIPER_SES || 'tr_TR-dfki-medium' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: FFmpeg ve yazı tipi
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
      - name: Piper (ücretsiz Türkçe seslendirme)
        run: pip install -q piper-tts==1.2.0
      - uses: actions/cache@v4
        with: { path: ~/piper, key: "piper-${{ env.PIPER_SES }}" }
      - name: Türkçe ses modeli
        run: |
          mkdir -p ~/piper && cd ~/piper
          IFS=- read -r DIL KISI KALITE <<< "$PIPER_SES"
          TABAN="https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/${DIL%%_*}/$DIL/$KISI/$KALITE/$PIPER_SES"
          [ -f "$PIPER_SES.onnx" ] || curl -fsSL -o "$PIPER_SES.onnx" "$TABAN.onnx"
          [ -f "$PIPER_SES.onnx.json" ] || curl -fsSL -o "$PIPER_SES.onnx.json" "$TABAN.onnx.json"
          echo "PIPER_MODEL=$HOME/piper/$PIPER_SES.onnx" >> "$GITHUB_ENV"
      - name: Video üret ve paylaş
        run: python3 gundem-sitesi/video/uret.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: video, path: video.mp4, if-no-files-found: ignore, retention-days: 3 }
